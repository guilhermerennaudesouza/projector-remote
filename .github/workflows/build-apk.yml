name: Build & Release Projector Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare APK for Release
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/*.apk release-apk/ProjectorRemote.apk
        ls -la release-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProjectorRemote-APK
        path: release-apk/ProjectorRemote.apk

    - name: Create GitHub Release with direct APK download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Projector Remote v1.0.0"
        body: |
          ### Controle Remoto para Projetor Android (192.168.2.41)
          
          Baixe o arquivo **ProjectorRemote.apk** abaixo diretamente no seu celular para instalar.
          
          - IP padrão: `192.168.2.41:5555`
          - Interface Material 3 estilo Tellyscope
          - Controle completo D-Pad, Volume, Power, Atalho Projectivy e Teclado
        files: release-apk/ProjectorRemote.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
