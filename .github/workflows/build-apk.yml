name: Build & Release Projector Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare APK for Release
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/*.apk release-apk/ProjectorRemote.apk
        ls -la release-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProjectorRemote-APK
        path: release-apk/ProjectorRemote.apk

    - name: Read app version
      id: version
      run: |
        VERSION=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
        if [ -z "$VERSION" ]; then echo "versionName nao encontrado" >&2; exit 1; fi
        echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Versao: $VERSION"

    - name: Create GitHub Release with direct APK download
      # Builds de outros branches geram apenas o artefato, sem mexer no release.
      # Cada versionName vira uma tag (v1.2, v1.3...); um novo push na mesma
      # versao so atualiza o APK dessa release.
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.name }}
        target_commitish: ${{ github.sha }}
        name: "Projector Remote v${{ steps.version.outputs.name }}"
        make_latest: true
        body: |
          ### Controle Remoto para Projetor Android (192.168.2.41)
          
          Baixe o arquivo **ProjectorRemote.apk** abaixo diretamente no seu celular para instalar.
          
          - IP padrão: `192.168.2.41:5555`
          - Interface Material 3 estilo Tellyscope
          - Controle completo D-Pad, Volume, Power, Atalho Projectivy e Teclado
          - Modo rápido (sendevent) para teclas com menos latência
        files: release-apk/ProjectorRemote.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
